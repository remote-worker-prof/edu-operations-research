document:
  dsl: '1.0.3'
  namespace: edu.practice
  name: agents-issue-workflow
  version: '1.1.0'
  title: 'Agent Issues + Git + Beads Workflow'
  summary: >
    Issue-driven workflow for Moodle Visual Editor.
    Use beads prefix `eor-`; commit header: [<id>] <type>(P#): <title>.
    Prefer `BEADS_BIN` (fallback `~/.local/bin/bd`) so the workflow works even
    when the binary is not on the global PATH. Git steps verify repository state,
    block empty commits and merge-conflict states, push only when `origin` exists,
    and export beads backup artifacts via git instead of the removed `bd sync`.
  metadata:
    x-agent:
      bound_instructions: AGENTS.md
      intent: Use this workflow for all issue-driven work in this repo
      issue_prefix: eor-
      beads_bin_fallback: '$HOME/.local/bin/bd'
      beads_backup_branch: beads-backup

do:
  - createIssue:
      run:
        shell:
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BEADS_BIN="${BEADS_BIN:-$HOME/.local/bin/bd}"
            test -x "$BEADS_BIN" || { echo "beads CLI not found at $BEADS_BIN" >&2; exit 1; }
            "$BEADS_BIN" create <title> --type task --priority 2 --description <why> --prefix eor-
  - markInProgress:
      run:
        shell:
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BEADS_BIN="${BEADS_BIN:-$HOME/.local/bin/bd}"
            "$BEADS_BIN" update <id> --status in_progress
  - verifyGitRepo:
      run:
        shell:
          command: |
            set -euo pipefail
            git rev-parse --is-inside-work-tree >/dev/null
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Resolve merge conflicts before continuing." >&2
              exit 1
            fi
            branch="$(git branch --show-current)"
            if [ -z "$branch" ]; then
              echo "Detached HEAD is not supported for issue-driven work." >&2
              exit 1
            fi
            git status --short
  - doWork:
      do:
        - implement:
            run:
              shell:
                command: 'perform implementation'
        - test:
            run:
              shell:
                command: 'run tests'
        - fix:
            run:
              shell:
                command: 'apply fixes'
  - stageChanges:
      run:
        shell:
          command: |
            set -euo pipefail
            git add -A
            if git diff --cached --quiet; then
              echo "No staged changes found." >&2
              exit 1
            fi
  - commitChanges:
      run:
        shell:
          command: |
            set -euo pipefail
            ID=<issue_id>; TYPE=<issue_type>; PRIO_RAW=<issue_priority>; TITLE=<issue_title>;
            DESC=<issue_description>;
            PRIO="${PRIO_RAW#P}"
            case "$ID" in
              eor-*) ;;
              *)
                echo "Issue id must use the eor- prefix: $ID" >&2
                exit 1
                ;;
            esac
            git rev-parse --is-inside-work-tree >/dev/null
            if git diff --cached --quiet; then
              echo "Nothing staged for commit." >&2
              exit 1
            fi
            git diff --cached --check
            HEADER="[$ID] $TYPE(P$PRIO): $TITLE"
            if [ -z "${DESC:-}" ]; then
              DESC="No description provided."
            fi
            FILES="$(git diff --cached --name-status --find-renames --find-copies | awk '
              {
                code=$1; from=$2; to=$3; status="modified";
                if (code ~ /^A/) status="created";
                else if (code ~ /^D/) status="deleted";
                else if (code ~ /^R/) { status="renamed"; printf "- %s %s -> %s (%s)\n", code, from, to, status; next }
                else if (code ~ /^C/) { status="copied"; printf "- %s %s -> %s (%s)\n", code, from, to, status; next }
                printf "- %s %s (%s)\n", code, from, status
              }'
            )"
            if [ -z "$FILES" ]; then
              FILES="- <no staged files detected>"
            fi
            printf "%s\n\n%s\n\nStaged files:\n%s\n" "$HEADER" "$DESC" "$FILES" | git commit -F -
  - pushChanges:
      run:
        shell:
          command: |
            set -euo pipefail
            branch="$(git branch --show-current)"
            if ! git remote get-url origin >/dev/null 2>&1; then
              echo "No origin remote configured; skipping git push."
              exit 0
            fi
            git fetch origin --prune
            if git rev-parse --verify "@{upstream}" >/dev/null 2>&1; then
              git pull --rebase --autostash --stat
            fi
            git push -u origin "$branch"
  - closeIssue:
      run:
        shell:
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BEADS_BIN="${BEADS_BIN:-$HOME/.local/bin/bd}"
            "$BEADS_BIN" close <id>
  - exportBeadsBackup:
      run:
        shell:
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            BEADS_BIN="${BEADS_BIN:-$HOME/.local/bin/bd}"
            test -x "$BEADS_BIN" || { echo "beads CLI not found at $BEADS_BIN" >&2; exit 1; }
            if ! git remote get-url origin >/dev/null 2>&1; then
              echo "No origin remote configured; skipping beads backup export."
              exit 0
            fi
            "$BEADS_BIN" backup export-git --branch beads-backup --remote origin
