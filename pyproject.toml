[project]
name = "edu-operations-research"
version = "0.1.0"
description = "Educational operations research labs and publication tooling."
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.uv]
package = false
default-groups = ["authoring", "docs"]

[dependency-groups]
authoring = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.3,<5",
  "matplotlib>=3.9,<4",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15,<2",
]
docs = [
  "jupyter-book>=1.0.4.post1,<2",
  "linkify-it-py>=2.0,<3",
]
