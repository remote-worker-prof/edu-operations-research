name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install authoring and docs dependencies
        run: uv sync --group authoring --group docs

      - name: Validate notebook JSON structure
        run: uv run python scripts/validate_notebooks.py

      - name: Check notebook role contracts
        run: uv run python scripts/check_notebook_contracts.py

      - name: Check Lab 02 transport notebook contract
        run: uv run python scripts/check_lab02_transport_contract.py

      - name: Execute worked examples
        run: uv run python scripts/execute_worked_examples.py

      - name: Build Jupyter Book
        run: uv run jupyter-book build . --warningiserror
